<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b35">
<meta name="description" content="StickShot — a fun one-touch stickman basketball arcade game.">
<title>StickShot — Street Basketball</title>
<style>
:root{color-scheme:dark;--ink:#f6f8ff;--muted:#aab8d1;--panel:#172743;--lime:#d9ff66;--orange:#ff9a43}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% -10%,#344e78 0,#101b31 58%,#080f20 100%);color:var(--ink);overscroll-behavior:none}
body{min-height:100svh;display:flex;justify-content:center;padding:14px}
.app{width:min(100%,520px);display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.brand{font-size:clamp(25px,7vw,34px);font-weight:1000;letter-spacing:-1.5px;text-shadow:0 3px 0 #071226}.brand span{color:var(--lime)}
.pill{border:1px solid #7187a8;background:linear-gradient(180deg,#2b4165,#172743);border-radius:999px;padding:7px 12px;color:#e5edff;font-size:12px;font-weight:900;box-shadow:0 3px 0 #091326}
.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:linear-gradient(145deg,#23395d,#14233f);border:1px solid #4b6387;border-radius:15px;padding:9px 8px;text-align:center;box-shadow:0 6px 14px #0003,inset 0 1px #ffffff14}
.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:900}.stat strong{font-size:22px;font-weight:1000;text-shadow:0 2px #0005}
.gamebox{position:relative;overflow:hidden;border:2px solid #8099b9;border-radius:22px;background:#80c9dc;box-shadow:0 18px 40px #0007, inset 0 1px #ffffff66;touch-action:none}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#081329a8;backdrop-filter:blur(7px);text-align:center}
.overlay.hidden{display:none}.modal{max-width:330px;background:linear-gradient(145deg,#253c61ed,#101d36f2);border:1px solid #7188a7;border-radius:24px;padding:25px 22px;box-shadow:0 20px 50px #0008,inset 0 1px #ffffff22}.modal h1{font-size:34px;line-height:1;margin:0 0 9px;text-shadow:0 3px #0005}.modal p{color:#d5def3;line-height:1.45;margin:8px 0 18px}
button{border:0;border-radius:14px;padding:13px 17px;font:900 14px system-ui;cursor:pointer;color:#17233a;background:linear-gradient(180deg,#e7ff8d,#b9e83f);box-shadow:0 5px 0 #789b27,0 8px 16px #0003;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 3px 0 #789b27}.secondary{background:linear-gradient(180deg,#354f76,#1b2d4b);color:#fff;box-shadow:0 5px 0 #0d1930;border:1px solid #647d9e}
.controls{display:flex;gap:9px}.controls button{flex:1;min-width:0;padding:12px 7px;font-size:12px}.hint{font-size:12px;color:#d2def4;text-align:center;margin:0;font-weight:800;letter-spacing:.25px}
.bottom{display:flex;justify-content:space-between;align-items:center;color:#9eaccb;font-size:11px;padding:0 3px}
@media(min-width:600px){body{padding:22px}.app{gap:14px}}
</style></style>
</head>
<body>
<main class="app">
<header><div class="brand">STICK<span>SHOT</span> 🏀</div><div class="pill" id="level">LEVEL 1</div></header>
<section class="scorebar">
<div class="stat"><small>Score</small><strong id="score">0</strong></div>
<div class="stat"><small>Best</small><strong id="best">0</strong></div>
<div class="stat"><small>Lives</small><strong id="lives">♥♥♥</strong></div>
</section>
<div class="gamebox" id="gamebox">
<canvas id="court" width="480" height="600" aria-label="Basketball court. Drag backward from the ball and release to shoot."></canvas>
<div class="overlay" id="overlay"><div class="modal"><h1>BUCKET TIME!</h1><p>Drag back from the ball to aim and build power. Release to shoot. Score baskets, build streaks, and beat your best!</p><button id="start">PLAY NOW</button></div></div>
</div>
<div class="controls"><button class="secondary" id="sound">🔊 SOUND ON</button><button class="secondary" id="bank">🎯 BANK: OFF</button><button class="secondary" id="restart">↻ RESTART</button></div>
<p class="hint">🏀 DRAG BACK TO AIM · RELEASE TO SHOOT</p>
<footer class="bottom"><span>STICKSHOT · STREET EDITION</span><span id="streak">STREAK ×0</span></footer>
</main>
<script>
(()=>{
const c=document.getElementById('court'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
const W=480,H=600,ground=520,ballStart={x:150,y:ground-24},gravity=.20;
let running=false,score=0,lives=3,level=1,streak=0,ball=null,aim=null,dragStart=null,hoop={x:350,y:230},hoopDir=1,frame=0,soundOn=true,particles=[],message='',messageTimer=0,shootTimer=0,wind=0,bankShot=false;
let best=Number(localStorage.getItem('stickshot-best')||0);$('best').textContent=best;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const audio=(freq=520)=>{if(!soundOn)return;try{const A=audio.ac||(audio.ac=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.08,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.15);o.start();o.stop(A.currentTime+.16)}catch(e){}};
function hud(){$('score').textContent=score;$('best').textContent=best;$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);$('level').textContent='LEVEL '+level;$('streak').textContent='STREAK ×'+streak}
function reset(){score=0;lives=3;level=1;streak=0;ball=null;aim=null;dragStart=null;particles=[];frame=0;hoop.x=350;hoopDir=1;wind=0;running=true;$('overlay').classList.add('hidden');hud()}
function drawCourt(){
 // Deep twilight arena, layered lights and a perspective hardwood floor
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#17294e');sky.addColorStop(.43,'#416c91');sky.addColorStop(.68,'#f2a06a');sky.addColorStop(.70,'#bd704f');sky.addColorStop(1,'#563345');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // arena glow and floodlights
 const sun=ctx.createRadialGradient(330,205,8,330,205,220);sun.addColorStop(0,'#fff1c9aa');sun.addColorStop(.38,'#ffc18a45');sun.addColorStop(1,'#ffc18a00');ctx.fillStyle=sun;ctx.fillRect(100,0,380,430);
 for(const lx of [38,442]){ctx.fillStyle='#f8e5bd';ctx.beginPath();ctx.arc(lx,54,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4d522';ctx.beginPath();ctx.moveTo(lx-5,58);ctx.lineTo(lx-105,320);ctx.lineTo(lx+105,320);ctx.closePath();ctx.fill()}
 // distant city / arena silhouettes
 for(let i=0;i<14;i++){const x=i*38-8,h=54+(i*29%94);ctx.fillStyle=i%2?'#1d3655':'#294665';ctx.fillRect(x,302-h,33,h);for(let yy=0;yy<h-12;yy+=17)for(let xx=6;xx<29;xx+=11){ctx.fillStyle='#ffd88a77';ctx.fillRect(x+xx,294-h+yy,4,6)}}
 ctx.fillStyle='#172b46';ctx.fillRect(0,292,W,32);
 // wood floor with perspective depth
 const floor=ctx.createLinearGradient(0,310,0,H);floor.addColorStop(0,'#e6a36c');floor.addColorStop(.32,'#c77b50');floor.addColorStop(1,'#713e3e');ctx.fillStyle=floor;ctx.fillRect(0,310,W,H-310);
 ctx.beginPath();ctx.moveTo(0,315);ctx.lineTo(W,315);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.strokeStyle='#ffd8a477';ctx.lineWidth=3;ctx.stroke();
 for(let y=337;y<H;y+=26){ctx.strokeStyle='#572f303d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let x=-40;x<=520;x+=48){ctx.strokeStyle='#572f302b';ctx.beginPath();ctx.moveTo(240+(x-240)*.25,315);ctx.lineTo(x,H);ctx.stroke()}
 ctx.strokeStyle='#ffe9c4a0';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(240,493,145,58,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(240,315);ctx.lineTo(240,H);ctx.stroke();
 // backboard support and polished glass panel
 const boardX=hoop.x+43,boardTop=hoop.y-78,boardBottom=hoop.y+5;
 ctx.save();ctx.lineCap='round';ctx.shadowColor='#071326aa';ctx.shadowBlur=12;ctx.shadowOffsetX=5;
 ctx.strokeStyle='#172943';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(boardX+5,boardTop-18);ctx.lineTo(boardX+5,ground-5);ctx.stroke();
 const glass=ctx.createLinearGradient(boardX-9,0,boardX+10,0);glass.addColorStop(0,'#7bb8d3');glass.addColorStop(.22,'#f4ffff');glass.addColorStop(.72,'#c9f0fa');glass.addColorStop(1,'#6599b6');
 ctx.fillStyle=glass;ctx.strokeStyle='#243e5d';ctx.lineWidth=4;ctx.fillRect(boardX-7,boardTop,14,boardBottom-boardTop);ctx.strokeRect(boardX-7,boardTop,14,boardBottom-boardTop);
 ctx.shadowBlur=0;ctx.strokeStyle='#ec754f';ctx.lineWidth=3;ctx.strokeRect(boardX-21,hoop.y-28,28,24);ctx.restore();
 // rim depth, net and braces
 ctx.strokeStyle='#263c57';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(hoop.x-35,hoop.y+3);ctx.lineTo(hoop.x+31,hoop.y+3);ctx.stroke();
 ctx.strokeStyle='#ff7047';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(hoop.x-35,hoop.y);ctx.lineTo(hoop.x+31,hoop.y);ctx.stroke();
 ctx.strokeStyle='#fff0d7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hoop.x-28,hoop.y+5);ctx.lineTo(hoop.x-20,hoop.y+42);ctx.lineTo(hoop.x+20,hoop.y+42);ctx.lineTo(hoop.x+28,hoop.y+5);ctx.stroke();
 for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(hoop.x+i*12,hoop.y+6);ctx.lineTo(hoop.x+i*8,hoop.y+40);ctx.stroke()}
 ctx.strokeStyle='#ffffff88';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hoop.x-18,hoop.y+17);ctx.lineTo(hoop.x+18,hoop.y+17);ctx.moveTo(hoop.x-15,hoop.y+29);ctx.lineTo(hoop.x+15,hoop.y+29);ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='900 12px system-ui';ctx.textAlign='left';ctx.fillText('WIND '+(wind>=0?'+':'')+wind.toFixed(1),16,27);
}}function stick(x,y,pose='idle'){
 ctx.save();ctx.translate(x,y);ctx.lineCap='round';ctx.lineJoin='round';
 ctx.fillStyle='#211d3155';ctx.beginPath();ctx.ellipse(0,2,31,7,0,0,Math.PI*2);ctx.fill();
 // shoes and bent legs
 ctx.strokeStyle='#17243c';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-4,-18);ctx.lineTo(-18,-4);ctx.moveTo(4,-18);ctx.lineTo(18,-4);ctx.stroke();
 ctx.strokeStyle='#f8f5e9';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-18,-4);ctx.lineTo(-29,-2);ctx.moveTo(18,-4);ctx.lineTo(29,-2);ctx.stroke();
 // jersey with side highlights
 ctx.fillStyle='#ff9845';ctx.strokeStyle='#17243c';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-14,-62,28,45,8);ctx.fill();ctx.stroke();
 ctx.fillStyle='#ffc078';ctx.fillRect(-9,-58,4,34);ctx.fillStyle='#fff1c9';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText('7',1,-34);
 // head, hair, expression
 ctx.fillStyle='#f3bd91';ctx.beginPath();ctx.arc(0,-80,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#17243c';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#26304a';ctx.beginPath();ctx.arc(0,-86,17,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-16,-87,7,9);ctx.fillStyle='#17243c';ctx.beginPath();ctx.arc(6,-80,2,0,Math.PI*2);ctx.fill();
 // animated shooting arm: wind-up, release, follow-through
 const lift=pose==='shoot'?1:pose==='follow'?1.25:pose==='windup'?.35:0;
 ctx.strokeStyle='#17243c';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(10,-54);ctx.lineTo(18+lift*5,-43-lift*10);ctx.lineTo(24+lift*5,-34-lift*24);ctx.stroke();
 ctx.strokeStyle='#f3bd91';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(10,-54);ctx.lineTo(18+lift*5,-43-lift*10);ctx.lineTo(24+lift*5,-34-lift*24);ctx.stroke();
 ctx.strokeStyle='#17243c';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-10,-54);ctx.lineTo(-24,-34);ctx.stroke();ctx.strokeStyle='#f3bd91';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-10,-54);ctx.lineTo(-24,-34);ctx.stroke();
 ctx.restore();
}}function drawBall(x,y,r=13){ctx.save();ctx.shadowColor='#241a22bb';ctx.shadowBlur=10;ctx.shadowOffsetY=5;const g=ctx.createRadialGradient(x-5,y-7,1,x,y,r);g.addColorStop(0,'#ffd18a');g.addColorStop(.38,'#ff9a3f');g.addColorStop(.82,'#e65f1f');g.addColorStop(1,'#873315');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#71391f';ctx.lineWidth=1.8;ctx.stroke();ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*.72,-1.15,1.15);ctx.stroke();ctx.restore()}function paint(){
 ctx.clearRect(0,0,W,H);drawCourt();
 const pose=shootTimer>8?'shoot':shootTimer>0?'follow':aim?'windup':'idle';stick(115,ground,pose);
 if(ball)drawBall(ball.x,ball.y);else drawBall(ballStart.x,ballStart.y);
 if(aim&&!ball){
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(ballStart.x,ballStart.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([]);
  const pullX=clamp(dragStart.x-aim.x,18,145),pullY=clamp(aim.y-dragStart.y,25,145),targetY=hoop.y+2,flight=clamp(34-pullX*.045,27,34),targetX=bankShot?hoop.x+30:clamp(hoop.x+(aim.x-dragStart.x)*.20,hoop.x-22,hoop.x+22),targetStartY=bankShot?hoop.y-30:targetY,vx=(targetX-ballStart.x)/flight,vy=(targetStartY-ballStart.y-gravity*flight*(flight-1)/2)/flight-(pullY-85)*.025;
  ctx.fillStyle='#14213d';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText('POWER '+Math.round((vx+Math.abs(vy))*4)+'%',240,565);
  // dotted preview arc
  ctx.fillStyle=bankShot?'#ffdf67':'#fff';for(let t=4;t<=flight;t+=3){const px=ballStart.x+vx*t,py=ballStart.y+vy*t+.5*gravity*t*(t-1);if(py>15&&py<ground) {ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill()}}
 }
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});
 if(messageTimer>0){ctx.fillStyle='#14213ddd';ctx.fillRect(110,90,260,55);ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.fillText(message,240,126);messageTimer--}
}
function spawnBurst(x,y,color){for(let i=0;i<20;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*7,life:35,r:3+Math.random()*3,color})}
function miss(){if(!running)return;lives--;streak=0;ball=null;message='NO BUCKET!';messageTimer=50;hud();if(lives<=0)endGame()}
function scoreShot(){score+=10+Math.min(streak,10)*2;streak++;level=1+Math.floor(score/40);if(score>best){best=score;localStorage.setItem('stickshot-best',best)}message=streak>1?streak+' IN A ROW!':'SWISH!';messageTimer=48;spawnBurst(hoop.x,hoop.y,'#d8ff57');audio(760);ball=null;hud()}
function endGame(){running=false;$('overlay').classList.remove('hidden');$('overlay').querySelector('h1').textContent='GAME OVER';$('overlay').querySelector('p').textContent='Final score: '+score+' · Best: '+best+'. Ready for another run?';$('start').textContent='PLAY AGAIN'}
function tick(){
 frame++;
 if(running){
  const speed=.22+level*.075,range=Math.max(25,75-level*3);
  if(!ball){hoop.x+=hoopDir*speed;if(hoop.x>350+range||hoop.x<350-range)hoopDir*=-1;}
  wind=level<3?0:Math.sin(frame/90)*Math.min(1.5,(level-2)*.18);
 }
 if(shootTimer>0)shootTimer--;
 if(ball&&running){
  const oldX=ball.x,oldY=ball.y;ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=gravity;
  // Backboard collision: a real bank-shot rebound, not just decoration.
  const boardX=hoop.x+43,boardTop=hoop.y-78,boardBottom=hoop.y+5,impactX=boardX-13;
  if(ball.bankExpected&&!ball.banked&&ball.vx>0&&oldX<impactX&&ball.x>=impactX&&ball.y>boardTop+5&&ball.y<boardBottom-5){
   ball.x=impactX;const reboundFrames=16;ball.vx=(hoop.x-ball.x)/reboundFrames;ball.vy=(ball.targetY-ball.y-gravity*reboundFrames*(reboundFrames-1)/2)/reboundFrames;ball.banked=true;audio(240);message='BANK!';messageTimer=24;
  }
  // Count a basket only while descending through the rim opening.
  if(!ball.scored&&oldY<ball.targetY&&ball.y>=ball.targetY&&ball.vy>0){
   const crossX=oldX+(ball.x-oldX)*((ball.targetY-oldY)/(ball.y-oldY));
   if(crossX>ball.targetX-25&&crossX<ball.targetX+25){ball.scored=true;scoreShot()}
  }
  else if(ball.y>ground+20||ball.x>W+35||ball.x<-35){miss()}
 }
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});particles=particles.filter(p=>p.life>0);
 paint();requestAnimationFrame(tick)
}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{if(!running||ball)return;const p=point(e);if(Math.hypot(p.x-ballStart.x,p.y-ballStart.y)>78)return;dragStart={x:ballStart.x,y:ballStart.y};aim=p;c.setPointerCapture(e.pointerId);e.preventDefault()});
c.addEventListener('pointermove',e=>{if(aim){aim=point(e);e.preventDefault()}});
c.addEventListener('pointerup',e=>{
 if(!aim||!running)return;const p=point(e),pullX=clamp(dragStart.x-p.x,18,145),pullY=clamp(p.y-dragStart.y,25,145);
 // Consistent preview and launch: drag controls arc and power; target is the moving rim.
 const flight=clamp(34-pullX*.045,27,34),targetY=hoop.y+2;
 const targetX=bankShot?hoop.x+30:clamp(hoop.x+(p.x-dragStart.x)*.20,hoop.x-22,hoop.x+22);
 const launchY=bankShot?hoop.y-30:targetY;
 const vx=(targetX-ballStart.x)/flight;
 const vy=(launchY-ballStart.y-gravity*flight*(flight-1)/2)/flight-(pullY-85)*.025;
 ball={x:ballStart.x,y:ballStart.y,vx,vy,scored:false,targetX:hoop.x,targetY,flight,age:0,bankExpected:bankShot,banked:false};aim=null;dragStart=null;shootTimer=18;audio(520);e.preventDefault()
});
c.addEventListener('pointercancel',()=>{aim=null;dragStart=null});\n$('start').onclick$('start').onclick=()=>{reset();$('overlay').querySelector('h1').textContent='BUCKET TIME!';$('overlay').querySelector('p').textContent='Touch the ball, pull backward and slightly down, then release. Turn BANK ON to hit the backboard before the hoop.';$('start').textContent='PLAY NOW'};
$('restart').onclick=()=>reset();$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'};$('bank').onclick=()=>{bankShot=!bankShot;$('bank').textContent=bankShot?'🎯 BANK: ON':'🎯 BANK: OFF';message=bankShot?'BANK SHOT READY':'DIRECT SHOT';messageTimer=35};
hud();paint();requestAnimationFrame(tick);
})();
</script>
</body></html>
