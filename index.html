<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b35">
<meta name="description" content="StickShot — a fun one-touch stickman basketball arcade game.">
<title>StickShot — Street Basketball</title>
<style>
:root{color-scheme:dark;--ink:#f5f7ff;--muted:#aab5d0;--panel:#172544;--lime:#d8ff57;--orange:#ff9c42}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% 0%,#263b67 0,#101b35 55%,#0b1328 100%);color:var(--ink);overscroll-behavior:none}
body{min-height:100svh;display:flex;justify-content:center;padding:14px}
.app{width:min(100%,520px);display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.brand{font-size:clamp(25px,7vw,34px);font-weight:1000;letter-spacing:-1.5px}.brand span{color:var(--lime)}
.pill{border:1px solid #526487;background:#1b2b4c;border-radius:999px;padding:7px 11px;color:#dce5ff;font-size:12px;font-weight:800}
.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#1a2a49;border:1px solid #34486d;border-radius:15px;padding:9px 8px;text-align:center;box-shadow:0 5px 14px #0002}
.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.stat strong{font-size:22px;font-weight:950}
.gamebox{position:relative;overflow:hidden;border:2px solid #536b92;border-radius:22px;background:#91d9e9;box-shadow:0 16px 36px #0005;touch-action:none}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#081329b8;backdrop-filter:blur(5px);text-align:center}
.overlay.hidden{display:none}.modal{max-width:330px}.modal h1{font-size:34px;line-height:1;margin:0 0 9px}.modal p{color:#d5def3;line-height:1.45;margin:8px 0 18px}
button{border:0;border-radius:14px;padding:13px 19px;font:900 15px inherit;cursor:pointer;color:#162039;background:var(--lime);box-shadow:0 5px 0 #8eaa31;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 3px 0 #8eaa31}.secondary{background:#2a3e63;color:#fff;box-shadow:0 5px 0 #172743;border:1px solid #62799e}
.controls{display:flex;gap:9px}.controls button{flex:1}.hint{font-size:12px;color:#c1cce4;text-align:center;margin:0}
.bottom{display:flex;justify-content:space-between;align-items:center;color:#9eaccb;font-size:11px;padding:0 3px}
@media(min-width:600px){body{padding:22px}.app{gap:14px}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand">STICK<span>SHOT</span> 🏀</div><div class="pill" id="level">LEVEL 1</div></header>
<section class="scorebar">
<div class="stat"><small>Score</small><strong id="score">0</strong></div>
<div class="stat"><small>Best</small><strong id="best">0</strong></div>
<div class="stat"><small>Lives</small><strong id="lives">♥♥♥</strong></div>
</section>
<div class="gamebox" id="gamebox">
<canvas id="court" width="480" height="600" aria-label="Basketball court. Drag backward from the ball and release to shoot."></canvas>
<div class="overlay" id="overlay"><div class="modal"><h1>BUCKET TIME!</h1><p>Drag back from the ball to aim and build power. Release to shoot. Score baskets, build streaks, and beat your best!</p><button id="start">PLAY NOW</button></div></div>
</div>
<div class="controls"><button class="secondary" id="sound">🔊 SOUND ON</button><button class="secondary" id="bank">🎯 BANK: OFF</button><button class="secondary" id="restart">↻ RESTART</button></div>
<p class="hint">🏀 DRAG BACK TO AIM · RELEASE TO SHOOT</p>
<footer class="bottom"><span>STICKSHOT · STREET EDITION</span><span id="streak">STREAK ×0</span></footer>
</main>
<script>
(()=>{
const c=document.getElementById('court'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
const W=480,H=600,ground=520,ballStart={x:150,y:ground-24},gravity=.20;
let running=false,score=0,lives=3,level=1,streak=0,ball=null,aim=null,dragStart=null,hoop={x:350,y:230},hoopDir=1,frame=0,soundOn=true,particles=[],message='',messageTimer=0,shootTimer=0,wind=0,bankShot=false;
let best=Number(localStorage.getItem('stickshot-best')||0);$('best').textContent=best;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const audio=(freq=520)=>{if(!soundOn)return;try{const A=audio.ac||(audio.ac=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.08,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.15);o.start();o.stop(A.currentTime+.16)}catch(e){}};
function hud(){$('score').textContent=score;$('best').textContent=best;$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);$('level').textContent='LEVEL '+level;$('streak').textContent='STREAK ×'+streak}
function reset(){score=0;lives=3;level=1;streak=0;ball=null;aim=null;dragStart=null;particles=[];frame=0;hoop.x=350;hoopDir=1;wind=0;running=true;$('overlay').classList.add('hidden');hud()}
function drawCourt(){
 // Neon sunset street court with layered skyline and polished hardwood
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#172b58');sky.addColorStop(.48,'#416d9b');sky.addColorStop(.70,'#f2a46e');sky.addColorStop(.705,'#d9824e');sky.addColorStop(1,'#874a3d');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // sunset glow
 const glow=ctx.createRadialGradient(340,185,5,340,185,190);glow.addColorStop(0,'#ffe6a455');glow.addColorStop(1,'#ffe6a400');ctx.fillStyle=glow;ctx.fillRect(130,0,350,390);
 // distant city silhouettes
 for(let i=0;i<12;i++){const x=i*45-8,h=65+(i*37%95);ctx.fillStyle=i%2?'#20395a':'#294766';ctx.fillRect(x,275-h,38,h);ctx.fillStyle='#ffd98a88';for(let wy=0;wy<h-15;wy+=19)for(let wx=7;wx<33;wx+=13)ctx.fillRect(x+wx,282-h+wy,4,6)}
 // court surface and boards
 const floor=ctx.createLinearGradient(0,ground,0,H);floor.addColorStop(0,'#e99b5e');floor.addColorStop(1,'#8e4d3c');ctx.fillStyle=floor;ctx.fillRect(0,ground,W,H-ground);
 ctx.strokeStyle='#ffe5c477';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground+4);ctx.lineTo(W,ground+4);ctx.stroke();
 ctx.strokeStyle='#ffe9d477';ctx.lineWidth=2;ctx.beginPath();ctx.arc(240,ground+34,112,Math.PI,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(240,ground);ctx.lineTo(240,H);ctx.stroke();
 for(let y=ground+28;y<H;y+=25){ctx.strokeStyle='#572f3040';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // Hoop support and vertical backboard: the collision plane matches this visible board
 const boardX=hoop.x+43,boardTop=hoop.y-78,boardBottom=hoop.y+5;
 ctx.save();ctx.shadowColor='#07132699';ctx.shadowBlur=12;ctx.shadowOffsetX=5;
 ctx.strokeStyle='#263c5a';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(boardX+4,boardTop-16);ctx.lineTo(boardX+4,ground-5);ctx.stroke();
 const glass=ctx.createLinearGradient(boardX-7,0,boardX+8,0);glass.addColorStop(0,'#d7f4ff');glass.addColorStop(.5,'#ffffff');glass.addColorStop(1,'#86b9d4');
 ctx.fillStyle=glass;ctx.strokeStyle='#304965';ctx.lineWidth=3;ctx.fillRect(boardX-5,boardTop,10,boardBottom-boardTop);ctx.strokeRect(boardX-5,boardTop,10,boardBottom-boardTop);ctx.restore();
 ctx.strokeStyle='#ef6b45';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(hoop.x-35,hoop.y);ctx.lineTo(hoop.x+31,hoop.y);ctx.stroke();
 ctx.strokeStyle='#fff2dc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hoop.x-27,hoop.y+4);ctx.lineTo(hoop.x-20,hoop.y+39);ctx.lineTo(hoop.x+20,hoop.y+39);ctx.lineTo(hoop.x+27,hoop.y+4);ctx.stroke();
 for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(hoop.x+i*12,hoop.y+5);ctx.lineTo(hoop.x+i*8,hoop.y+37);ctx.stroke()}
 ctx.fillStyle='#fff';ctx.font='900 12px system-ui';ctx.textAlign='left';ctx.fillText('WIND '+(wind>=0?'+':'')+wind.toFixed(1),16,28);
}function stick(x,y,pose='idle'){
 ctx.save();ctx.translate(x,y);ctx.lineCap='round';ctx.lineJoin='round';
 // grounded shadow
 ctx.fillStyle='#2b253b55';ctx.beginPath();ctx.ellipse(0,3,28,6,0,0,Math.PI*2);ctx.fill();
 // legs with sneakers
 ctx.strokeStyle='#17243c';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-3,-17);ctx.lineTo(-19,-2);ctx.moveTo(3,-17);ctx.lineTo(19,-2);ctx.stroke();
 ctx.strokeStyle='#f5f7ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-19,-2);ctx.lineTo(-28,-1);ctx.moveTo(19,-2);ctx.lineTo(28,-1);ctx.stroke();
 // jersey and torso
 ctx.fillStyle='#ff9b45';ctx.strokeStyle='#17243c';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-13,-61,26,43,7);ctx.fill();ctx.stroke();
 ctx.fillStyle='#fff1c9';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText('7',0,-34);
 // head and hair
 ctx.fillStyle='#f4bd91';ctx.beginPath();ctx.arc(0,-78,17,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle='#26304a';ctx.beginPath();ctx.arc(0,-84,17,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle='#18243d';ctx.beginPath();ctx.arc(6,-78,2,0,Math.PI*2);ctx.fill();
 // shooting arms animate through release
 const arm=pose==='shoot'?-1:pose==='follow'?-1.35:pose==='windup'?.45:0;
 ctx.strokeStyle='#f4bd91';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(10,-53);ctx.lineTo(23+arm*8,-42+arm*31);ctx.lineTo(27+arm*12,-29+arm*34);ctx.stroke();
 ctx.strokeStyle='#17243c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(10,-53);ctx.lineTo(23+arm*8,-42+arm*31);ctx.lineTo(27+arm*12,-29+arm*34);ctx.stroke();
 ctx.strokeStyle='#f4bd91';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-10,-53);ctx.lineTo(-23,-31);ctx.stroke();
 ctx.restore();
}function drawBall(x,y,r=13){ctx.save();ctx.shadowColor='#241a22aa';ctx.shadowBlur=8;ctx.shadowOffsetY=4;const g=ctx.createRadialGradient(x-5,y-6,2,x,y,r);g.addColorStop(0,'#ffc06b');g.addColorStop(.55,'#f47b25');g.addColorStop(1,'#a83e17');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#71391f';ctx.lineWidth=1.8;ctx.stroke();ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*.72,-1.1,1.1);ctx.stroke();ctx.restore()}
function paint(){
 ctx.clearRect(0,0,W,H);drawCourt();
 const pose=shootTimer>8?'shoot':shootTimer>0?'follow':aim?'windup':'idle';stick(115,ground,pose);
 if(ball)drawBall(ball.x,ball.y);else drawBall(ballStart.x,ballStart.y);
 if(aim&&!ball){
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(ballStart.x,ballStart.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([]);
  const pullY=clamp(aim.y-dragStart.y,0,150),targetY=hoop.y+2,flight=bankShot?38:clamp(40+pullY*.045,40,47),targetX=bankShot?hoop.x+38:clamp(hoop.x+(aim.x-dragStart.x)*.10,hoop.x-12,hoop.x+12),targetStartY=bankShot?hoop.y-35:targetY,vx=(targetX-ballStart.x)/flight,vy=(targetStartY-ballStart.y-gravity*flight*(flight-1)/2)/flight;
  ctx.fillStyle='#14213d';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText('POWER '+Math.round((vx+Math.abs(vy))*4)+'%',240,565);
  // dotted preview arc
  ctx.fillStyle=bankShot?'#ffdf67':'#fff';for(let t=4;t<=flight;t+=3){const px=ballStart.x+vx*t,py=ballStart.y+vy*t+.5*gravity*t*(t-1);if(py>15&&py<ground) {ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill()}}
 }
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});
 if(messageTimer>0){ctx.fillStyle='#14213ddd';ctx.fillRect(110,90,260,55);ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.fillText(message,240,126);messageTimer--}
}
function spawnBurst(x,y,color){for(let i=0;i<20;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*7,life:35,r:3+Math.random()*3,color})}
function miss(){if(!running)return;lives--;streak=0;ball=null;message='NO BUCKET!';messageTimer=50;hud();if(lives<=0)endGame()}
function scoreShot(){score+=10+Math.min(streak,10)*2;streak++;level=1+Math.floor(score/40);if(score>best){best=score;localStorage.setItem('stickshot-best',best)}message=streak>1?streak+' IN A ROW!':'SWISH!';messageTimer=48;spawnBurst(hoop.x,hoop.y,'#d8ff57');audio(760);ball=null;hud()}
function endGame(){running=false;$('overlay').classList.remove('hidden');$('overlay').querySelector('h1').textContent='GAME OVER';$('overlay').querySelector('p').textContent='Final score: '+score+' · Best: '+best+'. Ready for another run?';$('start').textContent='PLAY AGAIN'}
function tick(){
 frame++;
 if(running){
  const speed=.22+level*.075,range=Math.max(25,75-level*3);
  if(!ball){hoop.x+=hoopDir*speed;if(hoop.x>350+range||hoop.x<350-range)hoopDir*=-1;}
  wind=level<3?0:Math.sin(frame/90)*Math.min(1.5,(level-2)*.18);
 }
 if(shootTimer>0)shootTimer--;
 if(ball&&running){
  const oldX=ball.x,oldY=ball.y;ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=gravity;
  // Backboard collision: a real bank-shot rebound, not just decoration.
  const boardX=hoop.x+43,boardTop=hoop.y-78,boardBottom=hoop.y+5,impactX=boardX-13;
  if(ball.bankExpected&&!ball.banked&&ball.vx>0&&oldX<impactX&&ball.x>=impactX&&ball.y>boardTop+5&&ball.y<boardBottom-5){
   ball.x=impactX;const reboundFrames=16;ball.vx=(hoop.x-ball.x)/reboundFrames;ball.vy=(ball.targetY-ball.y-gravity*reboundFrames*(reboundFrames-1)/2)/reboundFrames;ball.banked=true;audio(240);message='BANK!';messageTimer=24;
  }
  // Count a basket only while descending through the rim opening.
  if(!ball.scored&&oldY<ball.targetY&&ball.y>=ball.targetY&&ball.vy>0){
   const crossX=oldX+(ball.x-oldX)*((ball.targetY-oldY)/(ball.y-oldY));
   if(crossX>ball.targetX-25&&crossX<ball.targetX+25){ball.scored=true;scoreShot()}
  }
  else if(ball.y>ground+20||ball.x>W+35||ball.x<-35){miss()}
 }
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});particles=particles.filter(p=>p.life>0);
 paint();requestAnimationFrame(tick)
}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{if(!running||ball)return;const p=point(e);dragStart={x:ballStart.x,y:ballStart.y};aim=p;c.setPointerCapture(e.pointerId);e.preventDefault()});
c.addEventListener('pointermove',e=>{if(aim){aim=point(e);e.preventDefault()}});
c.addEventListener('pointerup',e=>{
 if(!aim||!running)return;const p=point(e),pullX=clamp(dragStart.x-p.x,0,150),pullY=clamp(p.y-dragStart.y,0,150);
 // Solve the projectile equation for the basket, so every valid release has a reachable arc.
 const targetY=hoop.y+2,flight=bankShot?38:clamp(40+pullY*.045,40,47);
 const targetX=bankShot?hoop.x+30:clamp(hoop.x+(p.x-dragStart.x)*.10,hoop.x-12,hoop.x+12);
 const launchY=bankShot?hoop.y-30:targetY;
 const vx=(targetX-ballStart.x)/flight;
 const vy=(launchY-ballStart.y-gravity*flight*(flight-1)/2)/flight;
 ball={x:ballStart.x,y:ballStart.y,vx,vy,scored:false,targetX:hoop.x,targetY,flight,age:0,bankExpected:bankShot};aim=null;dragStart=null;shootTimer=18;audio(520);e.preventDefault()
});
$('start').onclick=()=>{reset();$('overlay').querySelector('h1').textContent='BUCKET TIME!';$('overlay').querySelector('p').textContent='Touch the ball, pull backward and slightly down, then release. Turn BANK ON to hit the backboard before the hoop.';$('start').textContent='PLAY NOW'};
$('restart').onclick=()=>reset();$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'};$('bank').onclick=()=>{bankShot=!bankShot;$('bank').textContent=bankShot?'🎯 BANK: ON':'🎯 BANK: OFF';message=bankShot?'BANK SHOT READY':'DIRECT SHOT';messageTimer=35};
hud();paint();requestAnimationFrame(tick);
})();
</script>
</body></html>
