<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b35">
<meta name="description" content="StickShot — a fun one-touch stickman basketball arcade game.">
<title>StickShot — Street Basketball</title>
<style>
:root{color-scheme:dark;--ink:#f5f7ff;--muted:#aab5d0;--panel:#172544;--lime:#d8ff57;--orange:#ff9c42}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% 0%,#263b67 0,#101b35 55%,#0b1328 100%);color:var(--ink);overscroll-behavior:none}
body{min-height:100svh;display:flex;justify-content:center;padding:14px}
.app{width:min(100%,520px);display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.brand{font-size:clamp(25px,7vw,34px);font-weight:1000;letter-spacing:-1.5px}.brand span{color:var(--lime)}
.pill{border:1px solid #526487;background:#1b2b4c;border-radius:999px;padding:7px 11px;color:#dce5ff;font-size:12px;font-weight:800}
.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#1a2a49;border:1px solid #34486d;border-radius:15px;padding:9px 8px;text-align:center;box-shadow:0 5px 14px #0002}
.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.stat strong{font-size:22px;font-weight:950}
.gamebox{position:relative;overflow:hidden;border:2px solid #536b92;border-radius:22px;background:#91d9e9;box-shadow:0 16px 36px #0005;touch-action:none}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#081329b8;backdrop-filter:blur(5px);text-align:center}
.overlay.hidden{display:none}.modal{max-width:330px}.modal h1{font-size:34px;line-height:1;margin:0 0 9px}.modal p{color:#d5def3;line-height:1.45;margin:8px 0 18px}
button{border:0;border-radius:14px;padding:13px 19px;font:900 15px inherit;cursor:pointer;color:#162039;background:var(--lime);box-shadow:0 5px 0 #8eaa31;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 3px 0 #8eaa31}.secondary{background:#2a3e63;color:#fff;box-shadow:0 5px 0 #172743;border:1px solid #62799e}
.controls{display:flex;gap:9px}.controls button{flex:1}.hint{font-size:12px;color:#c1cce4;text-align:center;margin:0}
.bottom{display:flex;justify-content:space-between;align-items:center;color:#9eaccb;font-size:11px;padding:0 3px}
@media(min-width:600px){body{padding:22px}.app{gap:14px}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand">STICK<span>SHOT</span> 🏀</div><div class="pill" id="level">LEVEL 1</div></header>
<section class="scorebar">
<div class="stat"><small>Score</small><strong id="score">0</strong></div>
<div class="stat"><small>Best</small><strong id="best">0</strong></div>
<div class="stat"><small>Lives</small><strong id="lives">♥♥♥</strong></div>
</section>
<div class="gamebox" id="gamebox">
<canvas id="court" width="480" height="600" aria-label="Basketball court. Drag backward from the ball and release to shoot."></canvas>
<div class="overlay" id="overlay"><div class="modal"><h1>BUCKET TIME!</h1><p>Drag back from the ball to aim and build power. Release to shoot. Score baskets, build streaks, and beat your best!</p><button id="start">PLAY NOW</button></div></div>
</div>
<div class="controls"><button class="secondary" id="sound">🔊 SOUND ON</button><button class="secondary" id="restart">↻ RESTART</button></div>
<p class="hint">🏀 DRAG BACK TO AIM · RELEASE TO SHOOT</p>
<footer class="bottom"><span>STICKSHOT · STREET EDITION</span><span id="streak">STREAK ×0</span></footer>
</main>
<script>
(()=>{
const c=document.getElementById('court'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
const W=480,H=600,ground=520;
let running=false,score=0,lives=3,level=1,streak=0,ball=null,aim=null,hoop={x:350,y:230},hoopDir=1,frame=0,soundOn=true,particles=[],message='',messageTimer=0;
let best=Number(localStorage.getItem('stickshot-best')||0);$('best').textContent=best;
const audio=()=>{if(!soundOn)return;try{const A=audio.ac||(audio.ac=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=520;o.type='sine';g.gain.setValueAtTime(.08,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.13);o.start();o.stop(A.currentTime+.14)}catch(e){}};
function hud(){$('score').textContent=score;$('best').textContent=best;$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);$('level').textContent='LEVEL '+level;$('streak').textContent='STREAK ×'+streak}
function reset(){score=0;lives=3;level=1;streak=0;ball=null;aim=null;particles=[];frame=0;hoop.x=350;hoopDir=1;running=true;$('overlay').classList.add('hidden');hud()}
function start(){if(!running)reset()}
function drawCourt(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8fe0ef');sky.addColorStop(.68,'#d7f4e9');sky.addColorStop(.69,'#e9b66f');sky.addColorStop(1,'#bb7547');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffffff55';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(70+i*120,80+(i%2)*35,42,13,0,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle='#e7a45e';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground+5);ctx.lineTo(W,ground+5);ctx.stroke();
 ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(240,ground+10,95,Math.PI,Math.PI*2);ctx.stroke();
 // backboard and hoop
 ctx.strokeStyle='#42536a';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(hoop.x+53,hoop.y-76);ctx.lineTo(hoop.x+53,hoop.y+23);ctx.stroke();
 ctx.fillStyle='#f8fbff';ctx.fillRect(hoop.x+18,hoop.y-74,74,7);ctx.strokeStyle='#52627a';ctx.lineWidth=2;ctx.strokeRect(hoop.x+18,hoop.y-74,74,7);
 ctx.strokeStyle='#f15d36';ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(hoop.x,hoop.y,35,8,0,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='#fff9';ctx.lineWidth=1.5;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(hoop.x+i*12,hoop.y+3);ctx.lineTo(hoop.x+i*7,hoop.y+42);ctx.stroke()}ctx.beginPath();ctx.moveTo(hoop.x-22,hoop.y+20);ctx.lineTo(hoop.x+22,hoop.y+20);ctx.stroke();
}
function stick(x,y,pose='idle'){
 ctx.save();ctx.translate(x,y);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#18243d';ctx.lineWidth=9;
 ctx.beginPath();ctx.arc(0,-78,17,0,Math.PI*2);ctx.fillStyle='#ffd2a6';ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,-60);ctx.lineTo(0,-15);ctx.moveTo(0,-48);ctx.lineTo(-23,-28);ctx.moveTo(0,-48);ctx.lineTo(pose==='shoot'?25:-18,pose==='shoot'?-77:-25);ctx.moveTo(0,-15);ctx.lineTo(-17,0);ctx.moveTo(0,-15);ctx.lineTo(18,0);ctx.stroke();
 ctx.fillStyle='#ff9d43';ctx.fillRect(-10,-58,20,29);ctx.restore();
}
function drawBall(x,y,r=13){ctx.fillStyle='#f47a24';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#65351e';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*.7,-1.1,1.1);ctx.stroke()}
function paint(){
 ctx.clearRect(0,0,W,H);drawCourt();stick(115,ground,'idle');
 if(ball)drawBall(ball.x,ball.y);
 else drawBall(150,ground-24);
 if(aim&&!ball){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(150,ground-24);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([]);drawBall(aim.x,aim.y,8)}
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});
 if(messageTimer>0){ctx.fillStyle='#14213ddd';ctx.fillRect(110,90,260,55);ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.fillText(message,240,126);messageTimer--}
}
function spawnBurst(x,y,color){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*7,life:35,r:3+Math.random()*3,color})}
function miss(){if(!running)return;lives--;streak=0;ball=null;message='NO BUCKET!';messageTimer=50;hud();if(lives<=0)endGame()}
function scoreShot(){score+=10+Math.min(streak,10)*2;streak++;level=1+Math.floor(score/50);if(score>best){best=score;localStorage.setItem('stickshot-best',best)}message=streak>1?''+streak+' IN A ROW!':'SWISH!';messageTimer=48;spawnBurst(hoop.x,hoop.y,'#d8ff57');audio();ball=null;hud()}
function endGame(){running=false;$('overlay').classList.remove('hidden');$('overlay').querySelector('h1').textContent='GAME OVER';$('overlay').querySelector('p').textContent='Final score: '+score+' · Best: '+best+'. Ready for another run?';$('start').textContent='PLAY AGAIN'}
function tick(){
 frame++;if(running){let speed=.35+level*.09;hoop.x+=hoopDir*speed;if(hoop.x>390||hoop.x<285)hoopDir*=-1}
 if(ball&&running){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.22;ball.vx*=.997;
  if(!ball.scored&&ball.vy>0&&ball.x>hoop.x-31&&ball.x<hoop.x+31&&ball.y>hoop.y-2&&ball.y<hoop.y+17){ball.scored=true;scoreShot()}
  else if(ball.y>ground+20||ball.x>W+30||ball.x<-30){miss()}
 }
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});particles=particles.filter(p=>p.life>0);
 paint();requestAnimationFrame(tick)
}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{if(!running||ball)return;const p=point(e);aim={x:p.x,y:p.y};c.setPointerCapture(e.pointerId);e.preventDefault()});
c.addEventListener('pointermove',e=>{if(aim){aim=point(e);e.preventDefault()}});
c.addEventListener('pointerup',e=>{if(!aim||!running)return;const p=point(e),dx=150-p.x,dy=(ground-24)-p.y;const power=Math.min(19,Math.max(5,Math.hypot(dx,dy)*.105));ball={x:150,y:ground-24,vx:Math.max(3,dx*.045),vy:-Math.max(5,Math.min(16,dy*.055+5)),scored:false};aim=null;audio();e.preventDefault()});
$('start').onclick=()=>{reset();$('overlay').querySelector('h1').textContent='BUCKET TIME!';$('overlay').querySelector('p').textContent='Drag back from the ball to aim and build power. Release to shoot. Score baskets, build streaks, and beat your best!';$('start').textContent='PLAY NOW'};
$('restart').onclick=()=>{reset()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'};
hud();paint();requestAnimationFrame(tick);
})();
</script>
</body></html>
